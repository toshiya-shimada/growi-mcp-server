[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "growi-mcp-server"
version = "0.1.0"
description = "MIT-licensed MCP server that deploys local Markdown files to GROWI via the REST API."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "toshiya-shimada" }]
keywords = ["mcp", "growi", "python", "rest", "wiki", "markdown"]
dependencies = [
  "httpx>=0.27.0",
  "mcp[cli]>=1.17.0",
  "pydantic>=2.8.0",
  "pyyaml>=6.0.0",
  "tenacity>=9.0.0",
  "typing-extensions>=4.12.0",
]

[project.optional-dependencies]
dev = [
  "pyright>=1.1.390",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "respx>=0.21.1",
  "ruff>=0.8.0",
]

[project.scripts]
growi-mcp-server = "growi_mcp_server.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/growi_mcp_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
